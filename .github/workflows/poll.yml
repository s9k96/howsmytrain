name: Poll train delays

# Fires on a fixed interval; scripts/poll_due.py decides which trains are
# actually due and makes zero API calls when none are. This is deliberately
# NOT one cron per train: arrival times shift with the timetable, and GitHub's
# scheduled runs drift 5-20 minutes under load (and occasionally skip). A wide
# due-window plus frequent cheap checks tolerates both.
on:
  schedule:
    # Asking every 10 min to actually GET one every ~30.
    #
    # GitHub's scheduler is best-effort and drops runs under load -- measured
    # on this repo, a "*/30" schedule delivered 9 runs in 24h instead of 48,
    # with gaps up to 231 min. Since a train is only due for 100 min, gaps
    # that size lose the journey outright (12301 was missed exactly this way).
    #
    # Over-scheduling is the mitigation: runs cost nothing on a public repo
    # (unlimited Actions minutes) and a run with nothing due makes zero API
    # calls, so the RailRadar budget is unaffected.
    # ponytail: brute force. If GitHub's reliability ever matters more than
    # this, move the trigger to an external cron (cron-job.org -> repository
    # dispatch) and drop back to a sparse schedule.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Poll every configured train, ignoring the due window"
        type: boolean
        default: false

concurrency:
  group: poll
  cancel-in-progress: false   # never cut a run off mid-write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll trains that are due
        env:
          RAILRADAR_API_KEY: ${{ secrets.RAILRADAR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TRAIN_NUMBERS: ${{ vars.TRAIN_NUMBERS }}
        run: python scripts/poll_due.py ${{ inputs.all && '--all' || '' }}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DB view · HowsMyTrain</title>
<meta name="theme-color" content="#0c0c0d">
<link rel="stylesheet" href="./styles.css">
<script src="./common.js"></script>
<style>
  /* Raw table can be wide/long -- let it scroll inside the card. */
  .db-scroll { overflow-x: auto; max-height: 70vh; overflow-y: auto; }
  .db-scroll thead th { position: sticky; top: 0; background: var(--bg); }
  .filters { margin-bottom: 18px; }
  td.mono { color: var(--text-2); }
</style>
</head>
<body>
<div class="page">
  <div id="nav-slot"></div>

  <main id="main" tabindex="-1">
    <div class="page-head">
      <div class="eyebrow">Every stored poll</div>
      <h1>Raw data</h1>
      <div class="meta" id="summary" role="status" aria-live="polite">Loading…</div>
    </div>

    <div class="card">
      <div class="filters">
        <input type="search" id="train-filter" list="train-list"
               placeholder="Search by number or name…" aria-label="Search trains">
        <!-- Native typeahead: the browser does the matching, and typing a name
             the list doesn't have still filters, so it's a search not a picker. -->
        <datalist id="train-list"></datalist>
        <label for="limit">Rows</label>
        <select id="limit">
          <option>200</option><option>500</option><option selected>2000</option>
        </select>
        <button id="refresh">Refresh</button>
      </div>
      <div class="db-scroll" id="table-container"></div>
    </div>
  </main>

  <div id="foot-slot"></div>
</div>

<script>
// Supabase access and formatting helpers live in common.js. This page used to
// hit the local FastAPI /api routes, which meant it was dead on GitHub Pages.

function delayClass(m) {
  if (m === null || m === undefined) return "";
  if (m <= 10) return "on-time";
  if (m <= 30) return "late";
  return "very-late";
}

let names = {};
let allPolls = [];

function render(polls) {
  const container = document.getElementById("table-container");
  if (!polls.length) {
    container.innerHTML = `<div class="empty-state">No polls stored yet for this selection.</div>`;
    return;
  }
  const rows = polls.map(p => {
    const href = `./train.html?train=${encodeURIComponent(p.train_number)}`;
    return `
    <tr data-href="${href}">
      <td class="mono" data-label="id">${p.id}</td>
      <td class="mono" data-label="journey_date">${esc(p.journey_date)}</td>
      <td class="cell-train" data-label="train">
        <a href="${href}" class="t-num">${esc(p.train_number)}</a>
        <span class="t-name">${esc(names[p.train_number] || "—")}</span>
      </td>
      <td class="${delayClass(p.delay_minutes)}" data-label="delay">${p.delay_minutes === null ? "–" : p.delay_minutes + " min"}</td>
      <td data-label="status">${esc(p.status ?? "–")}</td>
      <td data-label="station">${esc(p.current_station_code ?? "–")}</td>
      <td class="mono" data-label="polled_at">${new Date(p.polled_at).toLocaleString()}</td>
    </tr>`;
  }).join("");
  container.innerHTML = `
    <table class="fleet tabular db-long">
      <thead><tr>
        <th>id</th><th>journey_date</th><th>train</th><th>delay</th>
        <th>status</th><th>station</th><th>polled_at (fetched)</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  wireRows(container);
}

/** Number or name, substring, case-insensitive -- same rule as the fleet page. */
function applyFilter() {
  const q = document.getElementById("train-filter").value.trim().toLowerCase();
  const shown = !q ? allPolls : allPolls.filter(p =>
    p.train_number.toLowerCase().includes(q) ||
    (names[p.train_number] || "").toLowerCase().includes(q)
  );
  render(shown);
  const dates = new Set(shown.map(p => p.journey_date));
  document.getElementById("summary").textContent =
    `${shown.length} row${shown.length === 1 ? "" : "s"}`
    + (q ? ` of ${allPolls.length}` : "")
    + ` · ${dates.size} journey date${dates.size === 1 ? "" : "s"} · loaded ${new Date().toLocaleTimeString()}`;
}

async function load() {
  const limit = document.getElementById("limit").value;
  try {
    allPolls = await sb("polls", `select=*&order=polled_at.desc&limit=${encodeURIComponent(limit)}`);
    applyFilter();
    // Neutral: polls only land when a train is due, so a gap here is the
    // timetable, not a fault. The heartbeat lives on the health page.
    setPolled(allPolls.length ? new Date(allPolls[0].polled_at) : null,
              allPolls.length ? `LAST ROW ${istTime(new Date(allPolls[0].polled_at))} IST` : "NO ROWS",
              true);
  } catch (err) {
    console.error(err);
    document.getElementById("summary").textContent = "Failed to load: " + err.message;
  }
}

document.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("nav-slot").innerHTML = appbar("db");
  document.getElementById("foot-slot").innerHTML = footer();
  const box = document.getElementById("train-filter");
  try {
    const trains = await sb("trains", "select=train_number,name&order=train_number");
    names = Object.fromEntries(trains.map(t => [t.train_number, t.name]));
    document.getElementById("train-list").innerHTML = trains.map(t =>
      `<option value="${esc(t.train_number)}">${esc(t.name || "")}</option>`).join("");
  } catch (err) { console.error(err); }

  // Filtering is local to the rows already fetched, so it can run per keystroke.
  box.addEventListener("input", applyFilter);
  document.getElementById("limit").addEventListener("change", load);
  document.getElementById("refresh").addEventListener("click", load);

  load();
});
</script>
</body>
</html>

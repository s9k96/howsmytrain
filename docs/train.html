<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Train · HowsMyTrain</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0c0c0d">
<link rel="stylesheet" href="./styles.css">
<script src="./vendor/chart.umd.min.js"></script>
<script src="./common.js"></script>
<style>
  .table-scroll { overflow-x: auto; }
  .note { color: var(--text-3); font-size: 12px; line-height: 1.55; margin-top: 10px; max-width: 68ch; }
  /* Facts flow into as many columns as fit rather than stacking as table rows,
     which left most of the card empty on anything wider than a phone. */
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px 24px; margin: 0; }
  .kv > div { min-width: 0; }
  .kv dt {
    font: 400 10.5px/1.3 var(--mono); letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-label); margin-bottom: 6px;
  }
  .kv dd { margin: 0; font: 400 13px/1.4 var(--mono); }
  /* Chart cards size to plot + axis band so labels never force a nested scroll. */
  .chart-box { position: relative; height: 300px; }
</style>
</head>
<body>
<div class="page">
  <div id="nav-slot"></div>

  <main id="main" tabindex="-1">
    <div class="page-head">
      <div class="eyebrow"><a href="./index.html">← All trains</a></div>
      <h1 id="train-title">Loading…</h1>
      <div class="meta" id="train-subtitle" role="status" aria-live="polite"></div>
    </div>

    <div class="context hidden" id="context"></div>

    <div class="kpi-row" id="kpi-row"></div>

    <div class="card">
      <div class="card-head"><h2>Details</h2></div>
      <div id="details"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Final delay by day</h2></div>
      <div class="chart-box"><canvas id="trend-chart"></canvas></div>
      <div class="empty-state hidden" id="trend-empty"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Delay distribution</h2></div>
      <div class="chart-box"><canvas id="dist-chart"></canvas></div>
      <div class="empty-state hidden" id="dist-empty"></div>
      <div id="dist-table"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Every recorded journey</h2></div>
      <div class="table-scroll" id="daily-table"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>Every poll</h2></div>
      <p class="note">
        One row per API call, including the <code>not-started</code> readings
        that <em>Every recorded journey</em> above leaves out — those are polls
        that caught no live run, so they carry no usable delay.
      </p>
      <div class="table-scroll" id="polls-table"></div>
    </div>
  </main>

  <div id="foot-slot"></div>
</div>

<script>
// Supabase access, formatting and schedule helpers live in common.js.

// A histogram needs enough observations to have a shape; below this it is just
// a bar per day dressed up as a distribution (see dataviz anti-patterns:
// "a one-bar bar chart"). The daily table carries the data until then.
const MIN_FOR_DISTRIBUTION = 5;

// Ordered bins, not nominal categories: they run best -> worst. Thresholds
// match ON_TIME_THRESHOLD_MINUTES (10) in app/aggregate.py and the
// delayClass() buckets used across the other dashboards.
const BINS = [
  { label: "On time (≤10m)", test: (d) => d <= 10 },
  { label: "11–30m",         test: (d) => d > 10 && d <= 30 },
  { label: "31–60m",         test: (d) => d > 30 && d <= 60 },
  { label: "61–120m",        test: (d) => d > 60 && d <= 120 },
  { label: "Over 2h",        test: (d) => d > 120 },
];

const fmt = (m) => (m === null || m === undefined ? "–" : `${m} min`);

function delayClass(m) {
  if (m === null || m === undefined) return "";
  if (m <= 10) return "on-time";
  if (m <= 30) return "late";
  return "very-late";
}

// Just the class name -- common.js's band() returns {cls, text} and would
// otherwise be shadowed by this.
const tone = (m) => (m === null || m === undefined ? "" : band(m).cls);

/**
 * "59 min average" means nothing alone -- is that bad for this kind of train?
 * Compare against the rest of the fleet that has data, and give a rank.
 */
function renderContext(summary, fleet) {
  const el = document.getElementById("context");
  const withData = fleet.filter(t => t.journeys_observed > 0 && t.avg_delay_minutes !== null);
  if (summary.avg_delay_minutes === null || summary.avg_delay_minutes === undefined || withData.length < 2) {
    el.classList.add("hidden");
    return;
  }
  const mine = summary.avg_delay_minutes;
  const avg = withData.reduce((a, t) => a + t.avg_delay_minutes, 0) / withData.length;
  // Rank 1 = most punctual.
  const rank = withData.filter(t => t.avg_delay_minutes < mine).length + 1;
  const diff = mine - avg;
  const better = diff < 0;
  const word = Math.abs(diff) < 1 ? "about the same as" : `${Math.abs(Math.round(diff))} min ${better ? "better" : "worse"} than`;

  el.className = "context";
  el.innerHTML = `
    <span class="pill ${better ? "good" : "bad"}">${better ? "Better than average" : "Worse than average"}</span>
    <span>${word} the fleet average of <b>${Math.round(avg)} min</b>,
    ranking <b>${ordinal(rank)}</b>
    most punctual of ${withData.length} trains with data.</span>`;
}

function ordinal(n) {
  const s = ["th", "st", "nd", "rd"];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);   // 1st 2nd 3rd 4th … 11th 21st
}

function renderKPIs(summary, delays) {
  const avg = delays.length ? Math.round(summary.avg_delay_minutes ?? 0) : null;
  const med = delays.length ? Math.round(median(delays)) : null;
  const worst = delays.length ? Math.max(...delays) : null;
  const pct = summary.on_time_pct ?? null;

  const tiles = [
    ["Journeys observed", delays.length, "", ""],
    ["Average delay", avg, "min", tone(avg)],
    ["Median delay", med, "min", tone(med)],
    ["Worst delay", worst, "min", tone(worst)],
    ["On time", pct, "%", pct === null ? "" : (pct >= 70 ? "good" : pct >= 40 ? "warn" : "bad")],
  ];
  document.getElementById("kpi-row").innerHTML = tiles.map(([label, value, unit, tone]) => `
    <div class="stat-tile">
      <div class="label">${label}</div>
      <div class="value ${tone}">${value === null ? "–" : value}${value === null || !unit ? "" : `<span class="unit">${unit}</span>`}</div>
    </div>`).join("");
}

let trendChart = null;
let distChart = null;

// Single series -> one hue, no legend (the card title names it).
function renderTrend(rows) {
  const box = document.getElementById("trend-chart");
  const empty = document.getElementById("trend-empty");
  if (rows.length < 2) {
    empty.textContent = rows.length
      ? "Only one journey recorded so far — a trend needs at least two days."
      : "No journeys recorded yet.";
    empty.classList.remove("hidden");
    // The chart-box, not the canvas: it carries the fixed 300px height, so
    // hiding only the canvas leaves the card as a tall empty hole.
    box.parentElement.classList.add("hidden");
    return;
  }
  empty.classList.add("hidden");
  box.parentElement.classList.remove("hidden");

  // Chart.js refuses a canvas that already hosts a chart -- must destroy on
  // re-render.
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(box.getContext("2d"), {
    type: "line",
    data: {
      labels: rows.map(r => r.journey_date),
      datasets: [{
        label: "Final delay",
        data: rows.map(r => r.delay_minutes),
        borderColor: cssVar("--series-1"),
        backgroundColor: cssVar("--series-1"),
        borderWidth: 2,
        pointRadius: 4,
        pointHoverRadius: 6,
        pointBackgroundColor: cssVar("--series-1"),
        pointBorderColor: cssVar("--surface-1"),
        pointBorderWidth: 2,
        tension: 0.15,
        spanGaps: true,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (c) => `${c.formattedValue} min late` } },
      },
      interaction: { mode: "index", intersect: false },
      scales: {
        x: { grid: { color: cssVar("--gridline") }, ticks: { color: cssVar("--text-muted") } },
        y: {
          beginAtZero: true,
          title: { display: true, text: "Delay (minutes)", color: cssVar("--text-muted") },
          grid: { color: cssVar("--gridline") },
          ticks: { color: cssVar("--text-muted") },
        },
      },
    },
  });
}

function renderDistribution(delays) {
  const box = document.getElementById("dist-chart");
  const empty = document.getElementById("dist-empty");
  const counts = BINS.map(b => delays.filter(b.test).length);

  // Table twin renders regardless -- it is the accessible equivalent and the
  // only readable form while n is small.
  document.getElementById("dist-table").innerHTML = `
    <table class="tabular">
      <thead><tr><th>Delay range</th><th>Journeys</th><th>Share</th></tr></thead>
      <tbody>${BINS.map((b, i) => `
        <tr>
          <td>${b.label}</td>
          <td>${counts[i]}</td>
          <td>${delays.length ? Math.round(100 * counts[i] / delays.length) + "%" : "–"}</td>
        </tr>`).join("")}</tbody>
    </table>`;

  if (delays.length < MIN_FOR_DISTRIBUTION) {
    empty.textContent =
      `${delays.length} journey${delays.length === 1 ? "" : "s"} recorded — a distribution needs at least ${MIN_FOR_DISTRIBUTION} to mean anything. Counts are in the table below.`;
    empty.classList.remove("hidden");
    box.parentElement.classList.add("hidden");
    return;
  }
  empty.classList.add("hidden");
  box.parentElement.classList.remove("hidden");

  if (distChart) distChart.destroy();
  distChart = new Chart(box.getContext("2d"), {
    type: "bar",
    data: {
      labels: BINS.map(b => b.label),
      datasets: [{
        label: "Journeys",
        data: counts,
        backgroundColor: cssVar("--series-1"),
        borderRadius: 4,          // rounded data-end, anchored to baseline
        borderSkipped: "bottom",
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (c) => `${c.raw} of ${delays.length} journeys (${Math.round(100 * c.raw / delays.length)}%)`,
          },
        },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: cssVar("--text-muted") } },
        y: {
          beginAtZero: true,
          ticks: { color: cssVar("--text-muted"), precision: 0 },
          title: { display: true, text: "Journeys", color: cssVar("--text-muted") },
          grid: { color: cssVar("--gridline") },
        },
      },
    },
  });
}

/**
 * The schedule fields the poller maintains itself, so a wrong one is visible
 * rather than silently skewing which days this train gets polled.
 *
 * Deliberately excludes number/name (the page title) and the delay averages
 * (the KPI row) -- repeating them was what made this card mostly whitespace.
 */
function renderDetails(t, polls = []) {
  // Only a reading from today can speak to today's journey; polls arrive
  // newest-first, so [0] is the candidate and anything older is history.
  const latest = polls[0];
  const fresh = latest && isoDate(new Date(latest.polled_at)) === isoDate(new Date())
    ? latest : null;
  const j = journeyState(t, new Date(), fresh);
  const route = (t.source_code || t.destination_code)
    ? `${esc(t.source_code || "?")} → ${esc(t.destination_code || "?")}`
    : "unknown";
  const timing = (t.scheduled_departure || t.scheduled_arrival)
    ? `${hhmm(t.scheduled_departure)}${dayOffset(t)} → ${hhmm(t.scheduled_arrival)}`
    : "unknown";

  const facts = [
    ["Route", route],
    ["Scheduled", timing],
    ["Runs on", runDaysDots(t.run_days)],
    ["Today", j ? `<span class="pill ${j.key === "done" ? "good" : j.key === "running" ? "warn" : "idle"}">${j.label}</span>`
                : `<span class="dim">not running today</span>`],
    ["Schedule refreshed", t.updated_at ? new Date(t.updated_at).toLocaleDateString(undefined,
      { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }) : "never polled"],
  ];
  document.getElementById("details").innerHTML = `
    <dl class="kv">${facts.map(([k, v]) => `
      <div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>`;
}

function renderPolls(rows) {
  const c = document.getElementById("polls-table");
  if (!rows.length) {
    c.innerHTML = `<div class="empty-state">No polls recorded for this train yet.</div>`;
    return;
  }
  c.innerHTML = `
    <table class="tabular">
      <thead><tr><th>Polled at</th><th>Journey date</th><th>Status</th>
        <th>Delay</th><th>Last seen</th></tr></thead>
      <tbody>${rows.map(r => `
        <tr>
          <td>${new Date(r.polled_at).toLocaleString()}</td>
          <td>${esc(r.journey_date)}</td>
          <td>${esc(r.status ?? "–")}</td>
          <td class="${delayClass(r.delay_minutes)}">${fmt(r.delay_minutes)}</td>
          <td>${esc(r.current_station_code ?? "–")}</td>
        </tr>`).join("")}</tbody>
    </table>`;
}

function renderDaily(rows) {
  const c = document.getElementById("daily-table");
  if (!rows.length) {
    c.innerHTML = `<div class="empty-state">Nothing recorded yet. The poller stores one row per day, near this train's arrival time.</div>`;
    return;
  }
  c.innerHTML = `
    <table class="tabular">
      <thead><tr><th>Date</th><th>Final delay</th><th>Status</th><th>Last seen</th><th>Polled at</th></tr></thead>
      <tbody>${[...rows].reverse().map(r => `
        <tr>
          <td>${esc(r.journey_date)}</td>
          <td class="${delayClass(r.delay_minutes)}">${fmt(r.delay_minutes)}</td>
          <td>${esc(r.status ?? "–")}</td>
          <td>${esc(r.current_station_code ?? "–")}</td>
          <td>${r.polled_at ? new Date(r.polled_at).toLocaleString() : "–"}</td>
        </tr>`).join("")}</tbody>
    </table>`;
}

async function main() {
  const train = new URLSearchParams(location.search).get("train");
  if (!train) {
    document.getElementById("train-title").textContent = "No train selected";
    document.getElementById("train-subtitle").innerHTML =
      `Pick one from the <a href="./index.html">dashboard</a>.`;
    return;
  }
  try {
    const [summaryRows, daily, fleet, polls] = await Promise.all([
      sb("train_summary", `select=*&train_number=eq.${encodeURIComponent(train)}`),
      sb("daily_delays", `select=*&train_number=eq.${encodeURIComponent(train)}&order=journey_date`),
      // Fleet averages, for the comparison line. Small payload, one round trip.
      sb("train_summary", "select=train_number,avg_delay_minutes,journeys_observed"),
      sb("polls", `select=*&train_number=eq.${encodeURIComponent(train)}&order=polled_at.desc&limit=500`),
    ]);
    const summary = summaryRows[0] || { train_number: train };
    const delays = daily.map(r => r.delay_minutes).filter(d => d !== null && d !== undefined);

    document.title = `${train} · HowsMyTrain`;
    document.getElementById("train-title").textContent =
      summary.name ? `${train} · ${summary.name}` : train;
    document.getElementById("train-subtitle").textContent = [
      summary.source_code || summary.destination_code
        ? `${summary.source_code || "?"} → ${summary.destination_code || "?"}` : null,
      summary.scheduled_arrival ? `scheduled arrival ${String(summary.scheduled_arrival).slice(0, 5)} IST` : null,
    ].filter(Boolean).join(" · ");

    setPolled(polls.length ? new Date(polls[0].polled_at) : null,
              polls.length ? `LAST SEEN ${istTime(new Date(polls[0].polled_at))} IST` : "NEVER POLLED",
              true);
    renderContext(summary, fleet);
    renderKPIs(summary, delays);
    renderDetails(summary, polls);
    renderDaily(daily);
    renderPolls(polls);
    try {
      renderTrend(daily.filter(r => r.delay_minutes !== null));
      renderDistribution(delays);
    } catch (chartErr) {
      console.error(chartErr);
      document.getElementById("trend-empty").textContent = "Chart unavailable: " + chartErr.message;
      document.getElementById("trend-empty").classList.remove("hidden");
    }
  } catch (err) {
    console.error(err);
    document.getElementById("train-subtitle").textContent = "Failed to load: " + err.message;
  }
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("nav-slot").innerHTML = appbar("fleet");
  document.getElementById("foot-slot").innerHTML = footer();
  main();
});
</script>
</body>
</html>
